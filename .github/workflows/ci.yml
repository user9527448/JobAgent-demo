name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobagent_test
          POSTGRES_USER: jobagent
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobagent -d jobagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JOBAGENT_TEST_DATABASE_URL: postgresql+psycopg://jobagent:ci-test-only@localhost:5432/jobagent_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Run quality gate
        run: python scripts/check.py

      - name: Preserve coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
