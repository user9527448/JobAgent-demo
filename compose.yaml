name: jobagent

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobagent}
      POSTGRES_USER: ${POSTGRES_USER:-jobagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobagent-dev-only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
    environment:
      JOBAGENT_ENVIRONMENT: development
      JOBAGENT_LOG_LEVEL: ${JOBAGENT_LOG_LEVEL:-INFO}
      JOBAGENT_TIMEZONE: ${JOBAGENT_TIMEZONE:-Asia/Shanghai}
      JOBAGENT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jobagent}:${POSTGRES_PASSWORD:-jobagent-dev-only}@db:5432/${POSTGRES_DB:-jobagent}
      JOBAGENT_ATTACHMENT_STORAGE_PATH: /app/data/attachments
      JOBAGENT_ATTACHMENT_MAX_BYTES: ${JOBAGENT_ATTACHMENT_MAX_BYTES:-26214400}
      JOBAGENT_ATTACHMENT_CHUNK_BYTES: ${JOBAGENT_ATTACHMENT_CHUNK_BYTES:-65536}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - attachment-data:/app/data/attachments
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  attachment-data:
